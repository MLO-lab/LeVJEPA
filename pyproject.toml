[project]
name = "levjepa"
version = "2.0.0"
description = "LeVJEPA: efficient and scalable video pretraining without the heuristics"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "lightning>=2.6.0",
    "stable-pretraining @ git+https://github.com/galilai-group/stable-pretraining.git@3001802f",
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.24",
    "omegaconf>=2.3.0",
    "numpy>=2.0",
    "pillow>=12.2.0",
    "pylance>=6.0.0",
    "pyarrow==20.0.0",
    "safetensors>=0.4",
    "timm>=1.0",
    "torchmetrics>=1.0",
    "wandb>=0.19",
]

[project.optional-dependencies]
# Only needed to download and encode the Walking Tours dataset, not for training.
data = [
    "decord>=0.6.0",
    "yt-dlp>=2026.7.4",
]
# Only needed for the notebooks. yt-dlp resolves stream URLs and av (PyAV, which bundles its own ffmpeg libraries)
# decodes video on every platform, including where decord has no wheels.
notebook = [
    "matplotlib>=3.9.0",
    "jupyterlab>=4.2.0",
    "yt-dlp>=2026.7.4",
    "av>=13.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]