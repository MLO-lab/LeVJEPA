[project]
name = "le-vjepa"
version = "1.0.0"
description = "LeVJEPA: LeJEPA (SIGReg) self-supervised video pretraining on V-JEPA vision transformers"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "lightning>=2.6.0",
    "loguru>=0.7.0",
    "numpy>=1.26",
    "pillow>=12.2.0",
    "pyarrow==20.0.0",
    "pylance>=6.0.0",
    "stable-pretraining @ git+https://github.com/galilai-group/stable-pretraining.git@3001802f",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
# Only needed to download/encode the Walking Tours dataset, not for training.
data = [
    "decord>=0.6.0",
    "yt-dlp>=2026.7.4",
]
# Only needed for the notebooks, not for training. Self-contained on any
# platform (CUDA, Apple Silicon, CPU): yt-dlp resolves stream URLs and av
# (PyAV, which bundles its own ffmpeg libraries) decodes video everywhere,
# including where decord has no wheels.
notebook = [
    "transformers>=4.50.0",
    "matplotlib>=3.9.0",
    "jupyterlab>=4.2.0",
    "yt-dlp>=2026.7.4",
    "av>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# CUDA wheels on Linux; macOS falls back to the PyPI (CPU/MPS) build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
